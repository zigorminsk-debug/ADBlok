name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка #${{ github.run_number }}
    runs-on: ubuntu-latest

    env:
      # Порядковый номер сборки = versionCode APK
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (предустановлен в образе)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Подготовка постоянного ключа подписи
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/adblok.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Используется постоянный релизный ключ из секретов."
          else
            echo "signed=repo" >> "$GITHUB_OUTPUT"
            echo "Секреты не заданы — используется постоянный ключ из репозитория: keystore/adblok-release.p12"
          fi

      - name: Сборка Release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/adblok.jks', runner.temp) || '' }}
          # если KEYSTORE_FILE пуст, Gradle возьмёт keystore/adblok-release.p12 из репозитория
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Диагностика сборки
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 8 -E "What went wrong" build.log | head -n 60 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "^e: " build.log | head -n 30 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Проверка подписи
        env:
          # Постоянный ключ ADBlok. Если отпечаток отличается — сборка падает.
          EXPECTED_FINGERPRINT: 84d79999f3ac32660f9bab87a1e2d35c47c249042089d3fb6bdb97e5a6e3579c
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs -v "$APK" | tee signature.txt
          FP=$(grep -m1 'SHA-256 digest' signature.txt | awk '{print $NF}')
          echo "Отпечаток сертификата подписи: $FP"
          if [ -n "$EXPECTED_FINGERPRINT" ] && [ "$FP" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Подпись изменилась! ожидали $EXPECTED_FINGERPRINT, получили $FP — обновление APK не встанет поверх предыдущего"
            exit 1
          fi
          {
            echo "## Сборка #${BUILD_NUMBER}"
            echo "Отпечаток ключа (SHA-256): \`$FP\`"
            echo "APK: \`$(basename "$APK")\`"
            echo '```'
            grep -E 'Signer #1 certificate (DN|SHA-256 digest)' signature.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: ADBlok-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Релиз build-${{ github.run_number }}
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ADBlok сборка #${{ github.run_number }}
          body: |
            Автоматическая сборка #${{ github.run_number }}
            versionCode: ${{ github.run_number }}
            Коммит: ${{ github.sha }}
            Подпись: постоянный ключ ADBlok, SHA-256 84d79999f3ac32660f9bab87a1e2d35c47c249042089d3fb6bdb97e5a6e3579c
            Источник ключа: ${{ steps.keystore.outputs.signed == 'true' && 'секреты репозитория' || 'keystore/adblok-release.p12' }}
          files: app/build/outputs/apk/release/*.apk
